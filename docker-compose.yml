version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: anam-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anam_db}
      POSTGRES_USER: ${POSTGRES_USER:-anam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anam_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anam_user} -d ${POSTGRES_DB:-anam_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anam-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anam-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-anam_user}:${POSTGRES_PASSWORD:-anam_password}@db:5432/${POSTGRES_DB:-anam_db}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AI_METHOD=${AI_METHOD:-QWEN}
      - AUTH_USERNAME=${AUTH_USERNAME:-ADMIN}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-ADMIN1234}
      - AUTH_SECRET=${AUTH_SECRET:-anam-secret-key-2024}
      - OLLAMA_URL=http://host.docker.internal:11434
      - INTERPRETATION_MODEL=${INTERPRETATION_MODEL:-qwen2:7b}
      - MOORE_TRANSLATOR_API_URL=${MOORE_TRANSLATOR_API_URL:-https://fr-mos-translator-314397473739.europe-west1.run.app/api/translate}
      - TRANSLATION_LANG_MOORE=mos_Latn
      - ALLOW_UNKNOWN_STATIONS=1
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anam-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anam-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=/api/v1
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - anam-network

networks:
  anam-network:
    driver: bridge

volumes:
  postgres_data:


